<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Terminal interativo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#050505}
a{color:#A1A1A1}a:hover{color:#EDEDED}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; padding: 32px; background: #050505; font-family: 'JetBrains Mono', monospace; color: #EDEDED">
<div role="dialog" aria-label="Terminal" style="height: 100%; display: flex; flex-direction: column; border: 1px solid #2A2A2A; border-radius: 12px; background: #0E0E0E; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #1F1F1F">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #333333"></span>
<span style="width: 10px; height: 10px; border-radius: 50%; background: #333333"></span>
<span style="width: 10px; height: 10px; border-radius: 50%; background: #333333"></span>
<span style="margin-left: 8px; font-size: 12px; color: #8A8A8A">viniciusps — terminal</span>
</div>
<a href="Main.dc.html" style="min-height: 36px; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; text-decoration: none">fechar<span style="padding: 2px 6px; border: 1px solid #333333; border-radius: 4px; font-size: 11px">Esc</span></a>
</div>

<div ref="{{outRef}}" aria-live="polite" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px; font-size: 14px; line-height: 1.75">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="3">
<sc-if value="{{line.isCmd}}" hint-placeholder-val="{{ false }}">
<div style="white-space: pre-wrap"><span style="color: {{accent}}">visitante@viniciusps</span><span style="color: #8A8A8A">:~$</span> {{line.text}}</div>
</sc-if>
<sc-if value="{{line.isOut}}" hint-placeholder-val="{{ true }}">
<div style="white-space: pre-wrap; color: #A1A1A1">{{line.text}}</div>
</sc-if>
<sc-if value="{{line.isErr}}" hint-placeholder-val="{{ false }}">
<div style="white-space: pre-wrap; color: #FCA5A5">{{line.text}}</div>
</sc-if>
</sc-for>
<div style="display: flex; align-items: center; gap: 8px">
<label for="term-input" style="white-space: nowrap"><span style="color: {{accent}}">visitante@viniciusps</span><span style="color: #8A8A8A">:~$</span></label>
<input id="term-input" type="text" autocomplete="off" spellcheck="false" value="{{input}}" onChange="{{onChange}}" onKeyDown="{{onKey}}" placeholder="digite help" style="flex: 1 1 auto; min-width: 0; min-height: 32px; border: none; outline: none; background: transparent; color: #EDEDED; font: inherit; caret-color: {{accent}}">
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #1F1F1F">
<span style="font-size: 12px; color: #8A8A8A; margin-right: 4px">atalhos:</span>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.run}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #2A2A2A; border-radius: 6px; background: transparent; color: #A1A1A1; cursor: pointer; font: inherit; font-size: 12px">{{c.label}}</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#8804e5&quot;,&quot;options&quot;:[&quot;#67E8F9&quot;,&quot;#A3E635&quot;,&quot;#FBBF24&quot;,&quot;#F9A8D4&quot;]},&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:640}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      input: '',
      lines: [
        { kind: 'out', text: 'Bem-vindo ao terminal de viniciusps.tech.' },
        { kind: 'out', text: 'Digite help para ver os comandos ou use os atalhos abaixo.' }
      ]
    };
  }
  componentDidUpdate() {
    if (this.outEl) this.outEl.scrollTop = this.outEl.scrollHeight;
  }
  exec(raw) {
    const cmd = raw.trim().toLowerCase();
    if (cmd === 'clear') { this.setState({ lines: [], input: '' }); return; }
    const out = [];
    if (cmd === '') {
    } else if (cmd === 'help') {
      out.push('comandos disponíveis:');
      out.push('  whoami        quem sou eu');
      out.push('  ls projetos   lista os projetos');
      out.push('  cat stack     tecnologias que uso');
      out.push('  contato       como falar comigo');
      out.push('  cv            baixar currículo (pt | en)');
      out.push('  clear         limpa a tela');
    } else if (cmd === 'whoami') {
      out.push('Vinicius Santos — desenvolvedor backend em São Paulo.');
      out.push('Java/Spring Boot e C#/.NET. Backend @ XP Inc., ADS @ São Judas.');
    } else if (cmd === 'ls' || cmd === 'ls projetos' || cmd === 'ls projetos/') {
      out.push('fluxen/   ritmo/   telegram-bot/   scenestack/   ecobazar/');
    } else if (cmd === 'cat stack' || cmd === 'stack') {
      out.push('backend   java · spring boot · c# · .net · python');
      out.push('dados     postgresql · mysql · mongodb');
      out.push('frontend  react · typescript');
      out.push('infra     docker · coolify · nginx · dynatrace · grafana');
    } else if (cmd === 'contato') {
      out.push('email     [SEU EMAIL]');
      out.push('github    github.com/ViniciuPSantos');
      out.push('linkedin  [LINKEDIN]');
    } else if (cmd === 'cv' || cmd === 'cv pt' || cmd === 'cv en') {
      const l = cmd === 'cv en' ? 'en' : 'pt';
      out.push('baixando cv-vinicius-santos-' + l + '.pdf ...');
    } else if (cmd === 'sudo' || cmd.indexOf('sudo ') === 0) {
      out.push({ err: true, text: 'visitante não está no arquivo sudoers. Este incidente será reportado.' });
    } else {
      out.push({ err: true, text: 'comando não encontrado: ' + cmd + '. Digite help.' });
    }
    const add = [{ kind: 'cmd', text: raw }].concat(out.map((o) => typeof o === 'string' ? { kind: 'out', text: o } : { kind: 'err', text: o.text }));
    this.setState({ lines: this.state.lines.concat(add), input: '' });
  }
  renderVals() {
    const accent = this.props.accent ?? '#67E8F9';
    const lines = this.state.lines.map((l) => ({
      text: l.text,
      isCmd: l.kind === 'cmd',
      isOut: l.kind === 'out',
      isErr: l.kind === 'err'
    }));
    const chips = ['help', 'whoami', 'ls projetos', 'cat stack', 'contato'].map((c) => ({
      label: c,
      run: () => this.exec(c)
    }));
    return {
      accent,
      lines,
      chips,
      input: this.state.input,
      outRef: (el) => { this.outEl = el; },
      onChange: (e) => this.setState({ input: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.exec(this.state.input); }
    };
  }
}
</script>
</body>
</html>
